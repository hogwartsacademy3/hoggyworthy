<!DOCTYPE html>
<html>
<head>
  <title>Hogwarts Houses</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* JAM PASIR MAGIS */
    .hourglass {
      width: 40px;
      height: 60px;
      margin: 20px auto;
      border: 4px solid #f5d76e;
      border-top: 0;
      border-bottom: 0;
      border-left: 2px solid transparent;
      border-right: 2px solid transparent;
      position: relative;
      transform: rotate(45deg);
      animation: flip 1s infinite linear;
      display: none;
    }

    .hourglass::before,
    .hourglass::after {
      content: '';
      position: absolute;
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
    }

    .hourglass::before {
      border-bottom: 30px solid #f5d76e;
      top: -2px;
      left: -18px;
    }

    .hourglass::after {
      border-top: 30px solid #f5d76e;
      bottom: -2px;
      left: -18px;
    }

    @keyframes flip {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(180deg); }
      100% { transform: rotate(360deg); }
    }

    /* HOUSE CARD */
    .house {
      border: 2px solid #f5d76e;
      margin: 12px auto;
      padding: 14px;
      max-width: 420px;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.3s ease;
      position: relative;
    }

    .house:hover {
      background: #f5d76e;
      color: black;
      transform: scale(1.05);
      box-shadow: 0 0 20px #f5d76e, 0 0 40px #f5d76e inset;
    }

    /* SPARKLE EFFECT */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #f5d76e;
      border-radius: 50%;
      animation: sparkle 1s linear infinite;
      pointer-events: none;
    }

    @keyframes sparkle {
      0% { opacity: 0; transform: translate(0,0) scale(0.5);}
      50% { opacity: 1; transform: translate(10px,-10px) scale(1);}
      100% { opacity: 0; transform: translate(-10px,10px) scale(0.5);}
    }
  </style>
</head>

<body onload="protect()">

<nav>
  <a href="index.html">Home</a>
  <a href="houses.html">Houses</a>
  <a href="quidditch.html">Quidditch</a>
  <a href="classes.html">Classes</a>
</nav>

<div class="card">
  <h1>Hogwarts Houses</h1>

  <div class="house" onclick="showHouse('Gryffindor')">🦁 Gryffindor</div>
  <div class="house" onclick="showHouse('Slytherin')">🐍 Slytherin</div>
  <div class="house" onclick="showHouse('Ravenclaw')">🦅 Ravenclaw</div>
  <div class="house" onclick="showHouse('Hufflepuff')">🦡 Hufflepuff</div>

  <div class="hourglass" id="hourglass"></div>
  <div id="house-info" style="margin-top:20px; font-size:18px; position: relative;"></div>
</div>

<script>
const houseData = {
  "Gryffindor": {points:120, desc:"Courage & Bravery", color:"#e74c3c"},
  "Slytherin": {points:95, desc:"Ambition & Cunning", color:"#2ecc71"},
  "Ravenclaw": {points:110, desc:"Wisdom & Intelligence", color:"#3498db"},
  "Hufflepuff": {points:100, desc:"Loyalty & Hard Work", color:"#f1c40f"}
};

function showHouse(house){
  const info = houseData[house];
  const container = document.getElementById("house-info");
  const hourglass = document.getElementById("hourglass");

  // clear previous
  container.innerHTML = '';
  hourglass.style.display = 'block';

  // create sparkles
  let sparkles = [];
  for(let i=0;i<10;i++){
    let s = document.createElement('div');
    s.className = 'sparkle';
    s.style.background = info.color;
    s.style.top = Math.random()*50+'px';
    s.style.left = Math.random()*50+'px';
    container.appendChild(s);
    sparkles.push(s);
  }

  // after 1.2s show info
  setTimeout(() => {
    hourglass.style.display = 'none';
    container.innerHTML = `<strong style="color:${info.color}; font-size:22px;">${house}</strong><br>
                           Points: ${info.points}<br>
                           Traits: ${info.desc}`;
  }, 1200);
}
</script>

<script src="js/auth.js"></script>
</body>
</html>
